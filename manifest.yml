modules:
  macro:
    - key: status
      resource: main
      render: native
      layout: inline
      resolver:
        function: resolver
      title: Status
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: src/frontend/index.jsx
permissions:
  scopes:
    # Granular page scopes required by the Confluence v2 page properties
    # endpoints we use to persist this macro's status per page+macro instance.
    - read:page:confluence
    - write:page:confluence
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/0110dab8-0a9e-43a9-ba8b-84ec0c93fc0a
